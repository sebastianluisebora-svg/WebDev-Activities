<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zoogle | Wildlife Field Guide</title>
  <meta name="theme-color" content="#1f6b43">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%231f6b43'/%3E%3Ctext x='50' y='62' text-anchor='middle' font-size='58' font-weight='700' font-family='Arial, sans-serif' fill='white'%3EZ%3C/text%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Outfit:wght@500;600;700&family=Playfair+Display:wght@500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>

<body class="view-page">
  <div class="detail-card">
    <header class="vnav">
      <a class="vnav-brand" href="index.html">Zoogle</a>
      <a class="vnav-home" href="index.html">Home</a>
      <a class="vnav-back" id="backlink" href="index.html">Back</a>
     
      <form class="vsearch" action="index.html" method="get" role="search">
        <input name="q" type="search" placeholder="Search animals" autocomplete="off" enterkeyhint="search" aria-label="Search animals" required>
        <button type="submit" aria-label="Search">⌕</button>
      </form>
    </header>

    <main>
      <article class="detail-hero">
        <div class="detail-media">
          <div id="imageContainer" class="detail-image"></div>
        </div>

        <div class="detail-body">
          <h1 id="name" class="detail-name">
            <span class="spinner-border" role="status">
              <span class="visually-hidden">Loading...</span>
            </span>
          </h1>
          <div id="scientific" class="detail-scientific"></div>
          <span id="type" class="detail-type"></span>
          <p id="lead" class="detail-lead"></p>
          <ul id="stats" class="detail-stats"></ul>
        </div>
      </article>

      <div id="details" class="detail-more"></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="assets/groups.js"></script>
  <script>
 
    const API_KEY = 's22YJcFvvV0fngBJOpcx8dyVvevMqhY95dX2LwHX';
    const API_URL = 'https://api.api-ninjas.com/v1/animals';

    function capitalizeFirstLetter(str) {
      if (!str) return str; 
      return str.charAt(0).toUpperCase() + str.slice(1);
    }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    var elName = document.getElementById("name");
    var elScientific = document.getElementById("scientific");
    var elType = document.getElementById("type");
    var elLead = document.getElementById("lead");
    var elStats = document.getElementById("stats");
    var elImageContainer = document.getElementById("imageContainer");
    var elDetails = document.getElementById("details");
    var elBacklink = document.getElementById("backlink");

    const urlParams = new URLSearchParams(window.location.search);
    const name = urlParams.get('name');
    const q = urlParams.get('q');
    const group = urlParams.get('group');
    const page = urlParams.get('page');
    const filter = urlParams.get('filter');

  
    if (q != null) {
      const params = new URLSearchParams({ q, page: page || 1 });
      if (filter) params.set('filter', filter);
      elBacklink.href = "index.html?" + params.toString();
    } else if (group) {
      elBacklink.href = "index.html?" + new URLSearchParams({ group, page: page || 1 }).toString();
    }

  
    const STAT_KEYS = [
      ['weight', 'Weight'], ['height', 'Height'], ['length', 'Length'], ['lifespan', 'Life span'],
      ['top_speed', 'Top speed'], ['wingspan', 'Wingspan'], ['average_litter_size', 'Litter size'],
      ['age_of_sexual_maturity', 'Maturity']
    ];
    const LEAD_KEYS = ['slogan', 'most_distinctive_feature', 'distinctive_feature'];

    function statItem(label, raw) {
      const m = String(raw).match(/^\s*([\d.,]+(?:\s*(?:-|–|to)\s*[\d.,]+)?)\s*(.*)$/);
      const value = m ? m[1].trim() : String(raw);
      const unit = m ? m[2].trim() : '';
      return '<li><div class="stat-value">' + esc(value) + (unit ? '<i>' + esc(unit) + '</i>' : '') +
        '</div><div class="stat-label">' + esc(label) + '</div></li>';
    }

    const facts = (obj, skip) => {
      const items = Object.keys(obj || {}).filter(k => !skip || !skip.includes(k)).map(k =>
        '<div><dt>' + esc(capitalizeFirstLetter(k.replace(/_/g, ' '))) + '</dt><dd>' + esc(obj[k]) + '</dd></div>').join('');
      return items ? '<dl class="facts">' + items + '</dl>' : '';
    };
    const section = (title, inner, wide) => inner
      ? '<section class="detail-section' + (wide ? ' wide' : '') + '"><h2>' + esc(title) + '</h2>' + inner + '</section>' : '';

    async function loadDetailImage(animalName) {
      try {
        const response = await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(animalName.replace(/ /g, '_')));
        if (!response.ok) return;
        const data = await response.json();
        const src = (data.originalimage && data.originalimage.source) || (data.thumbnail && data.thumbnail.source);
        if (!src) return;
        const image = new Image();
        image.className = 'detail-photo';
        image.alt = '';
        image.onload = () => elImageContainer.classList.add('has-photo');
        image.onerror = () => image.remove();
        image.src = src;
        elImageContainer.prepend(image);
      } catch (error) {
        return;
      }
    }

    const getAnimal = async () => {
      elName.innerHTML = "Loading " + esc(name);

      try {
        const response = await fetch(API_URL + '?name=' + encodeURIComponent(name), { headers: { 'X-Api-Key': API_KEY } });
        if (!response.ok) throw new Error('The API returned an error (' + response.status + '). Check your API key.');
        const list = await response.json();

        const animal = list.find(a => a.name.toLowerCase() === name.toLowerCase()) || list[0];
        if (!animal) throw new Error('No animal found named "' + name + '".');

        const cls = ((animal.taxonomy && animal.taxonomy.class) || '').toLowerCase();
        const color = colors[cls] || colors.default;
        const ch = animal.characteristics || {};
        const locations = animal.locations || [];

        document.title = capitalizeFirstLetter(animal.name) + ' - Zoogle';
        elName.innerHTML = esc(capitalizeFirstLetter(animal.name));
        elScientific.innerHTML = esc((animal.taxonomy && animal.taxonomy.scientific_name) || '');
        elType.innerHTML = esc(classLabel(cls));
        elType.style.backgroundColor = color;
        elImageContainer.innerHTML = '<span class="detail-emoji" aria-hidden="true">' + (emojis[cls] || emojis.default) + '</span>';
    
        elImageContainer.style.backgroundColor = 'color-mix(in srgb, ' + color + ' 38%, var(--surface-2))';
        loadDetailImage(animal.name);

   
        const usedKeys = [];
        let lead = LEAD_KEYS.filter(k => ch[k]).map(k => { usedKeys.push(k); return String(ch[k]).trim().replace(/\.?$/, '.'); }).join(' ');
        if (!lead) {
          lead = capitalizeFirstLetter(animal.name) + ' belongs to the ' + classLabel(cls).toLowerCase() + ' group' +
            (locations.length ? ' and is found in ' + locations.slice(0, 3).join(', ') : '') + '.';
        }
        elLead.textContent = lead;

       
        const stats = STAT_KEYS.filter(([k]) => ch[k]).slice(0, 4);
        stats.forEach(([k]) => usedKeys.push(k));
        elStats.innerHTML = stats.map(([k, label]) => statItem(label, ch[k])).join('');

   
        let html = section('Taxonomy', facts(animal.taxonomy));
        if (locations.length) {
          html += section('Found in', '<ul class="pill-list">' + locations.map(l => '<li>' + esc(l) + '</li>').join('') + '</ul>');
        }
        html += section('Characteristics', facts(ch, usedKeys), true);
        elDetails.innerHTML = html;
      } catch (err) {
        elName.innerHTML = 'Something went wrong';
        elImageContainer.innerHTML = '<span class="detail-emoji" aria-hidden="true">🐾</span>';
        elDetails.innerHTML = '<div class="alert alert-danger">' + esc(err.message) + '</div>';
      }
    }

    if (name != null) {
      getAnimal();
    } else {
      elName.textContent = 'No animal selected';
      elImageContainer.innerHTML = '<span class="detail-emoji" aria-hidden="true">🐾</span>';
      elLead.innerHTML = 'Pick a species from the <a href="index.html">collection</a> to see its field notes.';
    }
  </script>
</body>

</html>
